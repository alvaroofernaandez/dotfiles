# Default shell placeholder (configured by Gentleman.Dots installer)
set -g default-command "/opt/homebrew/bin/zsh"
set -g default-shell "/opt/homebrew/bin/zsh"

# Carga TPM
set -g @plugin 'tmux-plugins/tpm'

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux Navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Tmux Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Which Key
set -g @plugin 'alexwforsythe/tmux-which-key'

# Tema Kanagawa
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'Kanagawa'
# cpu-usage and ram-usage are deliberately absent: kanagawa's cpu_info.sh sleeps
# to sample a CPU delta and takes ~5s per refresh, longer than status-interval
# itself. statusbar.sh in status-right reports both in ~17ms instead.
set -g @kanagawa-plugins "git"
set -g @kanagawa-ignore-window-colors true

# Floating window
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  # open in the same directory of the current pane
  display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

# File-tree sidebar: toggles a narrow yazi pane on the left of the current
# window, inheriting its directory. Closing it returns focus to the work pane.
#
# Two routes on purpose. On a "Spanish - ISO" layout Option+E is the DEAD KEY
# for the acute accent, so macOS consumes it to compose á/é and M-e never
# reaches tmux — which is why the original binding appeared to do nothing.
# M-t is a single press and collides with no dead key (those are e, i, u, n).
# prefix+e never touches Option at all, so it works regardless of layout or of
# how macos-option-as-alt behaves.
# Sourcing this file into a running server adds bindings but never removes the
# ones it replaced, so the retired key is unbound explicitly.
unbind -n M-e

bind-key -n M-t run-shell "~/.config/tmux/sidebar-toggle.sh"
bind-key e run-shell "~/.config/tmux/sidebar-toggle.sh"

# Close a file opened from the sidebar without typing the editor's quit command.
# It only ever closes windows open-file.sh created, and a vim-family editor is
# asked to quit rather than killed, so unsaved changes stay its decision.
bind-key -n M-w run-shell "~/.config/tmux/close-file.sh"
bind-key k run-shell "~/.config/tmux/close-file.sh"

# --- terminal & key handling ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

set -s extended-keys off

# yazi sends DA1/DSR probes at startup to detect terminal capabilities. Without
# passthrough tmux swallows them, yazi waits out its timeout and prints
# "Terminal response timeout" across the panel for several seconds before it
# draws anything. Enabling passthrough lets those probes reach Ghostty.
set -g allow-passthrough on

# Modo vim
set -g mode-keys vi
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# With `mouse on` tmux intercepts the drag, so the selection belongs to tmux and
# Ghostty has nothing of its own to copy: cmd+c comes back empty. The default
# `external` only relays OSC 52 sequences other programs send, never tmux's own
# copies, so mouse selections died in tmux's paste buffer. `on` makes tmux emit
# OSC 52 for its own copies too, which Ghostty accepts (clipboard-write = allow)
# and hands to the system clipboard — so cmd+c, Enter and y all reach it.
#
# Preferred over piping every copy binding to pbcopy: OSC 52 travels over SSH,
# where pbcopy would target the remote host instead of this machine.
set -s set-clipboard on

# Status bar position
set -g status-position top
set -g status on
# 15s rather than 10: the bar is instrumentation you glance at, and with several
# sessions open every refresh is paid once per session. The clock still updates
# well within the minute it displays.
set -g status-interval 15
set -g status-left-length 40
set -g status-right-length 120
# status-right itself is set AFTER the TPM run below: the kanagawa theme assigns
# its own during plugin load and would overwrite anything set here.

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1

# TPM init
run '~/.tmux/plugins/tpm/tpm'

# --- Overrides applied after plugin load -------------------------------------
# Anything the kanagawa theme assigns during load has to be re-set here to win.
# The segment bar (CPU / GPU / RAM / clock / date) lives in .agents/DESIGN.md.
set -g status-right "#(~/.config/tmux/statusbar.sh)"

# The bar has no background of its own: bg=default inherits the terminal's, so
# Ghostty's background-opacity and blur show through instead of being covered by
# an opaque band. tmux's own default here is bg=green, which is where the green
# strip came from — the kanagawa theme never sets this option.
# Colours are Kanagawa: fujiWhite text, springGreen for the active window.
# Clickable sidebar button. The keyboard route is fragile here — Option+E is a
# dead key on Spanish ISO and Option handling depends on macos-option-as-alt —
# so the mouse gives a route that depends on none of that.
#
# It shows no open/closed state on purpose: the state is already visible, since
# the panel is either on screen or it is not. A second indicator would be noise,
# and would desynchronise the moment yazi is closed with `q`.
#
# Rendered as bracketed text, not a solid block: in this bar solid blocks mean
# measurements, so a control has to read differently.
set -g status-left "#[range=user|sidebar]#[fg=colour108,bold] [FILES] #[norange]#[default]#{?client_prefix,#[fg=colour179]^A ,}#[fg=colour245]#S "

# Clicking the button toggles the sidebar; clicking anywhere else on the status
# line keeps tmux's default behaviour of selecting that window.
bind-key -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},sidebar}' \
  'run-shell "~/.config/tmux/sidebar-toggle.sh"' \
  'select-window -t=';

set -g status-style "bg=default,fg=colour223"
set -g status-left-style "bg=default"
set -g status-right-style "bg=default"
setw -g window-status-style "bg=default,fg=colour245"
setw -g window-status-current-style "bg=default,fg=colour108,bold"
setw -g window-status-activity-style "bg=default,fg=colour179"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour108"
set -g message-style "bg=colour108,fg=colour235"
