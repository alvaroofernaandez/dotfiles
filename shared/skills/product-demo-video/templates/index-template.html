<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Product Demo — V1</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #060F0C;
        --ink-2: #0B1E16;
        --green: #11A83F;
        --green-2: #2ADC71;
        --green-glow: rgba(42, 220, 113, 0.35);
        --text: #F6FAF8;
        --muted: #CBDBD3;
        --glass-bg: rgba(7, 24, 16, 0.78);
        --glass-border: rgba(42, 220, 113, 0.35);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px;
        overflow: hidden;
        background: var(--ink);
        font-family: 'Inter', sans-serif;
        color: var(--text);
      }
      #root { position: relative; width: 1920px; height: 1080px; }
      [data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="75"
         data-width="1920" data-height="1080">

      <!-- 8 scene sub-compositions ordered by data-start -->
      <div id="scene-1" class="clip"
           data-composition-id="scene-1-hook"
           data-composition-src="compositions/scene-01-hook.html"
           data-start="0" data-duration="7.0" data-track-index="1"></div>

      <div id="scene-2" class="clip"
           data-composition-id="scene-2-product"
           data-composition-src="compositions/scene-02-product.html"
           data-start="7.0" data-duration="7.5" data-track-index="1"></div>

      <div id="scene-3" class="clip"
           data-composition-id="scene-3-dashboard"
           data-composition-src="compositions/scene-03-dashboard.html"
           data-start="14.5" data-duration="8.5" data-track-index="1"></div>

      <div id="scene-4" class="clip"
           data-composition-id="scene-4-knowledge"
           data-composition-src="compositions/scene-04-knowledge.html"
           data-start="23.0" data-duration="10.0" data-track-index="1"></div>

      <div id="scene-5" class="clip"
           data-composition-id="scene-5-agent"
           data-composition-src="compositions/scene-05-agent.html"
           data-start="33.0" data-duration="11.5" data-track-index="1"></div>

      <div id="scene-6" class="clip"
           data-composition-id="scene-6-chat"
           data-composition-src="compositions/scene-06-chat.html"
           data-start="44.5" data-duration="9.5" data-track-index="1"></div>

      <div id="scene-7" class="clip"
           data-composition-id="scene-7-channels"
           data-composition-src="compositions/scene-07-channels.html"
           data-start="54.0" data-duration="10.5" data-track-index="1"></div>

      <div id="scene-8" class="clip"
           data-composition-id="scene-8-outro"
           data-composition-src="compositions/scene-08-outro.html"
           data-start="64.5" data-duration="10.5" data-track-index="1"></div>

      <!-- Transition overlays (7 transitions × 0.4s) on a separate track -->
      <!-- Add one <div class="clip transition-flash" data-start="6.8" data-duration="0.4" data-track-index="2"></div> etc -->

      <!-- Audio: voiceover always; music optional -->
      <audio id="vo" class="clip"
        src="audio/voiceover.wav"
        data-start="0" data-duration="75" data-track-index="3"
        data-volume="1"></audio>

      <!-- Uncomment to add music. Tune data-volume based on the source RMS. -->
      <!--
      <audio id="music" class="clip"
        src="audio/music.wav"
        data-start="0" data-duration="75" data-track-index="4"
        data-volume="0.38"></audio>
      -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 75 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
