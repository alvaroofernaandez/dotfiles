<!--
  Scene N — <Name>

  Replace:
    {{SCENE_ID}}        e.g. scene-3-dashboard
    {{SCENE_DURATION}}  e.g. 8.5
    {{CONTENT}}         the visible HTML
    {{TIMELINE}}        GSAP tweens

  IMPORTANT — non-negotiable from V3-V8 lessons:
  - CSS selectors MUST be prefixed with [data-composition-id="{{SCENE_ID}}"]
  - Timeline MUST end with tl.to({}, { duration: SCENE_DURATION }, 0)
  - Use gsap.fromTo() inside sub-comps, NOT gsap.from()
  - Synchronous timeline construction (no async, no setTimeout)
  - No Math.random() or Date.now() — use mulberry32 if needed
  - No repeat: -1 — calculate finite repeats from SCENE_DURATION
  - No exit animations (no opacity:0 / y offscreen tweens) — except for scene 8
-->
<template id="{{SCENE_ID}}-template">
  <div data-composition-id="{{SCENE_ID}}" data-width="1920" data-height="1080">

    <!-- Static end-state HTML — what the scene looks like at its hero frame -->
    <div class="scene-content">
      <!-- {{CONTENT}} -->
    </div>

    <style>
      [data-composition-id="{{SCENE_ID}}"] {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        background: var(--ink, #060F0C);
      }
      [data-composition-id="{{SCENE_ID}}"] .scene-content {
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        padding: 80px 100px; gap: 24px;
        box-sizing: border-box;
      }
      /* Add scene-specific selectors here, ALWAYS prefixed:
         [data-composition-id="{{SCENE_ID}}"] .title { ... }
         [data-composition-id="{{SCENE_ID}}"] .subtitle { ... }
      */
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const SCENE_DURATION = {{SCENE_DURATION}};
        const SCENE_ID = "{{SCENE_ID}}";
        const root = document.querySelector('[data-composition-id="' + SCENE_ID + '"]');

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // {{TIMELINE}}
        // Example entrance:
        // tl.fromTo(root.querySelector(".title"),
        //   { y: 50, opacity: 0 },
        //   { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        //   0.3);

        // MANDATORY — extend timeline to match host data-duration
        tl.to({}, { duration: SCENE_DURATION }, 0);
        window.__timelines[SCENE_ID] = tl;
      })();
    </script>
  </div>
</template>
