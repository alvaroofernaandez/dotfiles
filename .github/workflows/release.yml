# Builds the installer for every supported platform and publishes it.
#
# This is what makes the installer self-updating in practice: every push to
# main republishes the "latest" release, so `dotfiles-installer update` and the
# bootstrap script both pick up changes without anyone cutting a version by
# hand. Tagged pushes additionally produce a permanent, versioned release.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Bounded because the tmux suites park `sleep 600` processes inside panes as
    # stand-ins for long-running programs. If one of those outlives its server,
    # the command substitution in run-all.sh waits on a pipe that never closes
    # and the job sits there until GitHub's 6-hour default kills it. Failing in
    # twelve minutes with a log beats burning an afternoon of runner time.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

      # The shell suite covers install.sh, the tmux scripts and the guards that
      # keep employer material and machine indexes out of the repo. It runs on
      # Linux here; the tmux suites need a tmux binary.
      # run-all.sh parses each suite's summary with sd and rg. Without them the
      # counts come back empty and passing suites are reported as failures —
      # a silent, misleading break rather than an honest one. It now refuses to
      # start without them, so this step failing is unmissable.
      #
      # gitleaks is installed with `go install` rather than its upstream shell
      # script, which returns 404. The Go toolchain is already here for the
      # build, so this adds no dependency of its own.
      # zsh and yazi are what the suites actually exercise, not optional extras:
      # without them the zsh syntax check exits 127 and every sidebar test finds
      # an empty pane, which reads as a broken sidebar rather than a missing
      # program.
      - name: install shell test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux ripgrep zsh
          cargo install sd --quiet
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          # yazi ships prebuilt; building it from source here would add minutes.
          # `ya` comes along because newer yazi moved its config introspection
          # there, and the sidebar suite asks for it.
          yazi_url="https://github.com/sxyazi/yazi/releases/latest/download/yazi-x86_64-unknown-linux-gnu.zip"
          curl -fsSL "$yazi_url" -o /tmp/yazi.zip
          unzip -q -o /tmp/yazi.zip -d /tmp/yazi
          sudo install -m755 "$(find /tmp/yazi -name yazi -type f | head -1)" /usr/local/bin/yazi
          ya_bin="$(find /tmp/yazi -name ya -type f | head -1)"
          [ -n "$ya_bin" ] && sudo install -m755 "$ya_bin" /usr/local/bin/ya

          # The statusbar suite asserts that the bar renders identically under a
          # Spanish locale, where awk would otherwise emit a comma decimal
          # separator. An ungenerated locale silently falls back to C, so the
          # test compares C against C and the assertion means nothing.
          sudo locale-gen es_ES.UTF-8
          sudo update-locale

      - name: verify the toolchain is complete
        run: |
          # Checked explicitly: every one of these missing has already caused a
          # run that blamed the tests for a missing binary.
          for tool in tmux rg sd gitleaks zsh yazi; do
            command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }
            echo "$tool: $(command -v "$tool")"
          done

      # The tmux, yazi and zsh suites exercise the *installed* configs under
      # ~/.config, not the ones in the repo, so they need a real installation
      # first. This is the same instruction the README gives for a fresh machine.
      # The runner is throwaway, so linking into its $HOME is free.
      - name: install the dotfiles
        run: ./install.sh

      # Individually bounded as well as at the job level, so a hang is
      # attributed to the suites rather than to whatever ran last.
      - name: shell tests
        timeout-minutes: 8
        run: ./tests/run-all.sh

  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64, ext: ".exe" }
          - { os: windows, arch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          # -trimpath keeps absolute build paths out of the binary; -s -w drops
          # the symbol table, which roughly halves the download.
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version}" \
            -o "dist/dotfiles-installer-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" \
            ./cmd/dotfiles-installer

      - uses: actions/upload-artifact@v4
        with:
          name: dotfiles-installer-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum dotfiles-installer-* > SHA256SUMS
          cat SHA256SUMS

      # A rolling "latest" tag is what the bootstrap script and `update` point
      # at, so every push to main is immediately installable.
      - name: publish rolling latest
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Rolling build from `main` (${{ github.sha }}).

            Install or update:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh
            ```
          prerelease: true
          files: dist/*

      - name: publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
